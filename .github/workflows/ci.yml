name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (no runtime dependencies)
        run: pip install -e .

      - name: Install test tools
        run: pip install pytest

      - name: Run tests with unittest (zero deps beyond the package itself)
        run: python -m unittest -v

      - name: Run tests with pytest
        run: pytest -v

      - name: Smoke-test the CLI
        run: |
          actbreak --version
          actbreak --help
          actbreak run --help

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the package and pytest
        run: pip install -e ".[dev]"

      # Not the upstream `curl install.sh | sudo bash`: that runs a mutable
      # file from a branch tip as root on every push. Pinned tag, checked
      # sha256, no sudo. Bump ACT_VERSION and ACT_SHA256 together, taking the
      # hash from that release's checksums.txt.
      - name: Install act
        env:
          ACT_VERSION: v0.2.89
          ACT_SHA256: 0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSLf -o /tmp/act.tar.gz \
            "https://github.com/nektos/act/releases/download/${ACT_VERSION}/act_Linux_x86_64.tar.gz"
          echo "${ACT_SHA256}  /tmp/act.tar.gz" | sha256sum -c -
          tar -xzf /tmp/act.tar.gz -C "$HOME/.local/bin" act
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check act runs
        run: act --version

      - name: Run the integration test (real act + docker)
        run: pytest -v -m integration
