name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Nothing tied the artifact to the tag before this, and the two version
      # strings could drift from each other silently. PyPI keeps whatever a
      # publish uploads, so catch a mismatch here rather than after it ships.
      - name: Check the version is consistent and matches the tag
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MOD=$(python -c "import actbreak; print(actbreak.__version__)")
          if [ "$PKG" != "$MOD" ]; then
            echo "pyproject version $PKG does not match actbreak.__version__ $MOD"
            exit 1
          fi
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "release tag $GITHUB_REF_NAME does not match version $PKG"
              exit 1
            fi
          fi
          echo "building version $PKG"
          echo "PKG_VERSION=$PKG" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install the built wheel and smoke-test it
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install dist/*.whl
          /tmp/v/bin/python -c "import actbreak"
          GOT=$(/tmp/v/bin/actbreak --version)
          echo "$GOT"
          # Assert, don't just print: the wheel about to be published has to
          # report the version this run checked.
          test "$GOT" = "actbreak $PKG_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
